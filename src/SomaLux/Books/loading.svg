    <path class="spike spike-3" stroke="#4D4D4D" d="M41 132l95 55"/>
    <path class="spike spike-4" stroke="#4D4D4D" d="M8 256h109"/>
    <path class="spike spike-5" stroke="#4D4D4D" d="M41 380l95-55"/>
    <path class="spike spike-6" stroke="#4D4D4D" d="M132 471l55-95"/>
    <path class="spike spike-7" stroke="#4D4D4D" d="M256 504V395"/>
    <path class="spike spike-8" stroke="#EEEEEE" d="M325 136l55-95"/>
    <path class="spike spike-9" stroke="#DCDCDC" d="M376 187l95-55"/>
    <path class="spike spike-10" stroke="#737373" d="M380 471l-55-95"/>
    <path class="spike spike-11" stroke="#969696" d="M471 380l-95-55"/>
    <path class="spike spike-12" stroke="#B9B9B9" d="M504 256H395"/>
  </g>
